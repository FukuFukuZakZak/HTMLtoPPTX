# Keep enough room for implementation while compacting before long tool traces
# consume most of the model context window.
model_auto_compact_token_limit = 120000
model_auto_compact_token_limit_scope = "total"

# Applies to shell/function output stored in conversation history. Individual
# high-volume MCP tools below use tighter limits.
tool_output_token_limit = 6000

[features]
multi_agent = true
hooks = true

[mcp_servers.code-review-graph]
enabled = false
command = "uvx"
args = ["--from", "code-review-graph==2.3.7", "code-review-graph", "serve"]
cwd = "C:\\GoDev\\HTMLtoPPTX"
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.better-code-review-graph]
command = "uvx"
args = ["--python", "3.13", "--from", "better-code-review-graph[security]==3.21.0", "better-code-review-graph"]
cwd = "C:\\GoDev\\HTMLtoPPTX"
enabled_tools = ["graph", "query", "review", "security"]
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.better-code-review-graph.env]
MCP_TRANSPORT = "stdio"

[mcp_servers.better-code-review-graph.tools.query]
output_token_limit = 3500

[mcp_servers.better-code-review-graph.tools.review]
output_token_limit = 5000

[mcp_servers.better-code-review-graph.tools.graph]
output_token_limit = 3000

[mcp_servers.better-code-review-graph.tools.security]
output_token_limit = 4000

[mcp_servers.serena]
command = 'C:\Users\福家\.local\bin\serena.exe'
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
cwd = "C:\\GoDev\\HTMLtoPPTX"
startup_timeout_sec = 30
tool_timeout_sec = 120

