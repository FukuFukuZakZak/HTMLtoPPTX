<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; }
      .slide {
        display: none;
        box-sizing: border-box;
        width: 1280px;
        height: 720px;
        padding: 64px;
        overflow: hidden;
        color: rgb(24, 35, 51);
        background: rgb(255, 254, 250);
        font-family: "Yu Gothic", sans-serif;
      }
      .slide.active { display: flex; flex-direction: column; }
      h1 { margin: 0 0 24px; font-size: 52px; line-height: 1.25; }
      p { width: 720px; margin: 0; font-size: 28px; line-height: 1.6; }
      strong { color: rgb(207, 85, 47); }
    </style>
  </head>
  <body>
    <section class="slide active"><h1>スライド 1</h1><p>表示中のスライドです。<br>明示改行も保持します。</p></section>
    <section class="slide"><h1>スライド 2</h1><p>非表示でも<strong>個別測定</strong>します。</p></section>
    <section class="slide"><h1>スライド 3</h1><p>3枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 4</h1><p>4枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 5</h1><p>5枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 6</h1><p>6枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 7</h1><p>7枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 8</h1><p>8枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 9</h1><p>9枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 10</h1><p>10枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 11</h1><p>11枚目の内容です。</p></section>
    <section class="slide"><h1>スライド 12</h1><p>12枚目の内容です。</p></section>
  </body>
</html>
