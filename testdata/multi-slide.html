<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; }
      .slide {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        color: rgb(24, 35, 51);
        background: rgb(255, 254, 250);
        font-family: "Yu Gothic", sans-serif;
      }
      h1 { position: absolute; left: 120px; top: 150px; width: 1100px; padding: 24px; color: rgb(255, 255, 255); background: rgb(47, 124, 128); border: 4px solid rgb(207, 85, 47); font-size: 72px; }
      p { position: absolute; left: 124px; top: 310px; width: 900px; font-size: 32px; }
    </style>
  </head>
  <body>
    <section class="slide"><h1>最初のスライド</h1><p>複数ページ変換の確認用です。</p></section>
    <section class="slide"><h1>2枚目のスライド</h1><p>順番どおりに出力されます。</p></section>
    <section class="slide"><h1>最後のスライド</h1><p>進捗は3 / 3枚で完了します。</p></section>
  </body>
</html>
