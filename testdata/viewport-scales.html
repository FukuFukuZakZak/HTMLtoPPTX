<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>ページ表示倍率の回帰確認</title>
<style>
  body { margin: 0; font-family: Meiryo, sans-serif; }
  .viewer { width: 1280px; height: 720px; transform-origin: center; }
  .slide { box-sizing: border-box; width: 1280px; height: 720px; padding: 72px 96px; background: #f8fafc; color: #17324d; }
  h1 { margin: 0 0 48px; font-size: 48px; line-height: 64px; }
  p { margin: 0; font-size: 32px; line-height: 48px; }
  .card { margin-top: 48px; padding: 24px; border: 2px solid #178577; border-radius: 20px; background: white; }
</style>
<div class="viewer" style="transform:scale(0.5)"><section class="slide"><h1>表示倍率 0.5</h1><p>日本語の本文 / Editable text</p><div class="card"><p>全ページで本文は24pt・同じ位置</p></div></section></div>
<div class="viewer" style="transform:scale(1.25)"><section class="slide"><h1>表示倍率 1.25</h1><p>日本語の本文 / Editable text</p><div class="card"><p>全ページで本文は24pt・同じ位置</p></div></section></div>
<div class="viewer" style="transform:scale(-0.0833333)"><section class="slide"><h1>表示倍率 マイナス</h1><p>日本語の本文 / Editable text</p><div class="card"><p>全ページで本文は24pt・同じ位置</p></div></section></div>
<div class="viewer" style="scale:0"><section class="slide"><h1>表示倍率 ゼロ</h1><p>日本語の本文 / Editable text</p><div class="card"><p>全ページで本文は24pt・同じ位置</p></div></section></div>
</html>
