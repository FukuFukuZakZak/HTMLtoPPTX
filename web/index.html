<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>HTML → PowerPoint Converter</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="product-mark" aria-label="HTML to PowerPoint Converter">
          <span aria-hidden="true">H</span><i></i><span aria-hidden="true">P</span>
        </p>
        <h1>HTML → PowerPoint</h1>
      </div>
      <p class="local-note"><span aria-hidden="true"></span>このPC内だけで変換</p>
    </header>

    <main class="workspace">
      <section class="intro" aria-labelledby="intro-title">
        <p class="kicker">スライド変換</p>
        <h2 id="intro-title">HTMLのスライド束を、<br>編集できるPowerPointへ。</h2>
        <p>1つのHTMLに含まれる <code>.slide</code> を順番に読み取り、1要素を1ページとして出力します。</p>
        <ol class="flow" aria-label="変換の流れ">
          <li><span>HTML</span><small>読み込み</small></li>
          <li><span>.slide</span><small>ページ化</small></li>
          <li><span>PPTX</span><small>ダウンロード</small></li>
        </ol>
      </section>

      <section class="converter" aria-labelledby="converter-title">
        <div class="converter-heading">
          <div>
            <p class="kicker">変換するファイル</p>
            <h2 id="converter-title">HTMLを選択</h2>
          </div>
          <span class="format-badge">16:9</span>
        </div>

        <label class="drop-zone" id="drop-zone" for="html-file">
          <input id="html-file" type="file" accept=".html,.htm,text/html">
          <span class="file-glyph" aria-hidden="true"><b></b><b></b><b></b></span>
          <strong>ここにHTMLをドロップ</strong>
          <span>またはクリックしてファイルを選択</span>
        </label>

        <div class="file-row" id="file-row" hidden>
          <span class="file-type" aria-hidden="true">HTML</span>
          <span class="file-copy">
            <strong id="file-name"></strong>
            <small id="file-size"></small>
          </span>
        </div>

        <div class="actions">
          <button class="primary-button" id="convert-button" type="button" disabled>
            PPTXへ変換
            <span aria-hidden="true">→</span>
          </button>
          <a class="download-button" id="download-link" hidden>
            PPTXを保存
            <span aria-hidden="true">↓</span>
          </a>
        </div>

        <section class="progress-card" id="progress-card" aria-labelledby="progress-title" hidden>
          <div class="progress-copy">
            <div>
              <p class="kicker" id="progress-title">変換状況</p>
              <strong id="progress-label">準備しています</strong>
            </div>
            <span id="progress-count">0 / 0 枚</span>
          </div>
          <progress id="conversion-progress" max="1" aria-describedby="progress-detail"></progress>
          <div class="progress-footer" role="status" aria-live="polite" aria-atomic="true">
            <span id="progress-detail">HTMLを読み取っています</span>
            <button class="text-button" id="cancel-button" type="button">キャンセル</button>
          </div>
        </section>

        <p class="message" id="message" role="status" aria-live="polite"></p>
      </section>
    </main>

    <div class="render-host" id="render-host" aria-hidden="true"></div>
    <script src="./converter-core.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
